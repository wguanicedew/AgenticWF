# All-in-one AgenticWF (auth + KB + agent) behind host Caddy. Needs Docker Compose >= 2.17
# (additional_contexts).
#
#   sudo install -m 0600 container/agenticwf.env.example /etc/agenticwf/agenticwf.env   # edit it
#   scripts/fetch-sources.sh            # the service repos pinned in sources.env, into .src/
#   docker compose build
#   # The image's settings, to edit on the host (models: agent.cfg [llm], kb.cfg [models]). Take
#   # them from the image, not .src/: the build switches the agent's [knowledge] section on.
#   for f in agent.cfg kb.cfg; do docker run --rm --entrypoint cat agenticwf:latest /etc/agenticwf/$f \
#       | sudo tee /etc/agenticwf/$f > /dev/null; done
#   docker compose up -d
#
# AUTH_SRC / AUTH_LOGTO_SRC / AUTH_KEYCLOAK_SRC / KB_SRC / AGENT_SRC (environment or a local .env
# file) build other checkouts instead.
#
# The identity provider: AGENTICWF_AUTH_PROVIDER=logto (default) or keycloak in agenticwf.env, with
# the matching Caddy site file (README.md, Identity provider).
#
# Host networking: the services listen on 127.0.0.1 only (LISTEN_HOST), where host Caddy reaches
# them, and Logto sends mail through the host's MTA on 127.0.0.1:25. Ports: 3001 Logto, 3002 Logto
# admin (or 8080 Keycloak, 9000 its health), 8010 authsvc, 8000 agent, 8020 KB, and PostgreSQL on
# PGPORT (5432); they must be free on the host.
services:
  agenticwf:
    image: agenticwf:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: container/Dockerfile
      # RUN steps (dnf, pip, downloads) use the host network: some hosts block bridged outbound traffic.
      network: host
      additional_contexts:
        auth: ${AUTH_SRC:-.src/auth}
        auth-logto: ${AUTH_LOGTO_SRC:-.src/auth-logto}
        auth-keycloak: ${AUTH_KEYCLOAK_SRC:-.src/auth-keycloak}
        kb: ${KB_SRC:-.src/kb}
        agent: ${AGENT_SRC:-.src/agent}
    network_mode: host
    env_file: /etc/agenticwf/agenticwf.env
    volumes:
      - agenticwf-data:/var/lib/agenticwf
      # The agent's and the KB's settings (models in [llm] and [models], ...), edited on the host.
      # After editing them: `docker compose up -d --force-recreate`. Keys go in agenticwf.env
      # (api_key_env), not here.
      - type: bind
        source: /etc/agenticwf/agent.cfg
        target: /etc/agenticwf/agent.cfg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/agenticwf/kb.cfg
        target: /etc/agenticwf/kb.cfg
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  # Optional: a cross-encoder reranker for the KB (BAAI/bge-reranker-v2-m3 on Hugging Face
  # text-embeddings-inference), on 127.0.0.1:8081. Off unless asked for:
  #   docker compose --profile reranker up -d
  # then in /etc/agenticwf/kb.cfg uncomment [models.rerank.bge-reranker], set
  # [models] default_rerank = bge-reranker, and `docker compose up -d --force-recreate agenticwf`.
  # TEI_IMAGE picks the build: cpu-<version> (default; ~0.5-2 s per search on a few cores),
  # <version> for Ampere GPUs (A100, A10, RTX 30xx), 89-<version> (L4, L40, RTX 40xx),
  # hopper-<version> (H100), turing-<version> (T4); a GPU build also needs the `deploy` block below.
  reranker:
    profiles: [reranker]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.7}
    network_mode: host
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--hostname", "127.0.0.1", "--port", "8081",
              "--max-client-batch-size", "256"]
    environment:
      HF_HUB_OFFLINE: ${TEI_OFFLINE:-0}     # 1 once the model is in the volume (no download at start)
    volumes:
      - reranker-models:/data              # the model (~2.3 GB), downloaded on first start
    restart: unless-stopped
    # deploy:                              # a GPU build: the NVIDIA container toolkit on the host
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  agenticwf-data:
  reranker-models:
