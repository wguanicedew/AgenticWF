; Logto OSS: OIDC / sign-in on LOGTO_PORT, admin console on LOGTO_ADMIN_PORT. As AgenticWF-auth's
; logto.ini, but started by start-logto-aio.sh, which adds the default email connector first.
[program:logto]
command=/usr/local/bin/log-prefix.sh logto /usr/local/bin/start-logto-aio.sh
user=logto
directory=/opt/logto
environment=HOME="/home/logto"
autostart=%(ENV_AUTH_AUTOSTART)s
priority=20
autorestart=true
; seeding on first boot can take a while
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
