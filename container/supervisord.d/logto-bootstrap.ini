; Configure Logto from the environment once per boot (logto-bootstrap.py): API resource, roles,
; applications, email sign-up, Custom JWT. Runs as root (it writes the apps' secrets for authsvc)
; and exits. authsvc waits for it; if it fails, authsvc fails and fatal.ini stops the container.
[program:logto-bootstrap]
command=/usr/local/bin/log-prefix.sh logto-bootstrap /opt/authsvc/venv/bin/python /usr/local/bin/logto-bootstrap.py
user=root
priority=25
autostart=%(ENV_AUTH_AUTOSTART)s
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
