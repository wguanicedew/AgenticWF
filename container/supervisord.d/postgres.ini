; PostgreSQL 16 (PGDG) shared by all services: databases logto and authsvc (TCP 127.0.0.1:PGPORT,
; passwords), kb and agent (Unix socket /run/postgresql, peer authentication).
[program:postgres]
command=/usr/local/bin/log-prefix.sh postgres %(ENV_PGBIN)s/postgres -D %(ENV_PGDATA)s -p %(ENV_PGPORT)s
user=postgres
priority=10
autorestart=true
startsecs=5
; SIGINT = PostgreSQL "fast" shutdown
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
