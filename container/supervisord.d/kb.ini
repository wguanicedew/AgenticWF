; The KB API on KB_PORT (Caddy's /kb/* upstream), KB_AUTH_MODE=authsvc. Same as AgenticWF-KB's
; kb.ini, with its own PORT: the agent's start script reads PORT too.
[program:kb]
command=/usr/local/bin/log-prefix.sh kb /usr/local/bin/start-kb.sh
user=kb
directory=/home/kb
environment=HOME="/home/kb",PORT="%(ENV_KB_PORT)s"
autostart=%(ENV_KB_AUTOSTART)s
priority=30
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
