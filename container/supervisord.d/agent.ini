; The agent API on AGENT_PORT (Caddy's application upstream). Same as AgenticWF-agent's agent.ini,
; with its own PORT: the KB's start script reads PORT too. Starts after the KB, its knowledge service.
[program:agent]
command=/usr/local/bin/log-prefix.sh agent /usr/local/bin/start-agent.sh
user=agent
directory=/home/agent
environment=HOME="/home/agent",PORT="%(ENV_AGENT_PORT)s"
autostart=%(ENV_AGENT_AUTOSTART)s
priority=35
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
