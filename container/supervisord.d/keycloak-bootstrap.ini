; Once per boot, after Keycloak is ready (keycloak-bootstrap.sh): the master realm's Frontend URL
; follows KEYCLOAK_ADMIN_URL, so the admin console works on that URL (e.g. an SSH tunnel). Runs as
; keycloak (it reads the master admin's password) and exits; never fails the container.
[program:keycloak-bootstrap]
command=/usr/local/bin/log-prefix.sh keycloak-bootstrap /usr/local/bin/keycloak-bootstrap.sh
user=keycloak
environment=HOME="/home/keycloak"
autostart=%(ENV_KEYCLOAK_AUTOSTART)s
priority=25
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
