; Keycloak (AGENTICWF_AUTH_PROVIDER=keycloak): OIDC, sign-in, account and admin consoles on
; KEYCLOAK_PORT under KEYCLOAK_PATH (/idp); health on KEYCLOAK_MANAGEMENT_PORT. As
; AgenticWF-auth-keycloak's keycloak.ini, started only for that provider.
[program:keycloak]
command=/usr/local/bin/log-prefix.sh keycloak /usr/local/bin/start-keycloak.sh
user=keycloak
directory=/opt/keycloak
environment=HOME="/home/keycloak"
autostart=%(ENV_KEYCLOAK_AUTOSTART)s
priority=20
autorestart=true
; first boot creates the schema and imports the realm, which takes a while
startsecs=20
startretries=10
; Keycloak shuts down gracefully on SIGTERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
