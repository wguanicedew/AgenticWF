; AgenticWF auth service on AUTHSVC_PORT (Caddy forward_auth target, browser login). As
; AgenticWF-auth's authsvc.ini, but started by start-authsvc-aio.sh, which waits for logto-bootstrap.
[program:authsvc]
command=/usr/local/bin/log-prefix.sh authsvc /usr/local/bin/start-authsvc-aio.sh
user=authsvc
directory=/opt/authsvc
environment=HOME="/home/authsvc"
autostart=%(ENV_AUTH_AUTOSTART)s
priority=30
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
