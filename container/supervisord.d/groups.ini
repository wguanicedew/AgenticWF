; Programs grouped by repo in `supervisorctl status`: auth:logto, auth:logto-bootstrap,
; auth:authsvc; kbsvc:kb, kbsvc:kb-service, kbsvc:kb-worker-N; agentsvc:agent,
; agentsvc:agent-worker-N. Control them as `restart kbsvc:kb` or `restart agentsvc:*`. Replaces the
; repos' groups.ini (auth's lists rest-example, which this image leaves out). postgres stays on
; its own.
[group:auth]
programs=logto,logto-bootstrap,authsvc

[group:kbsvc]
programs=kb,kb-service,kb-worker

[group:agentsvc]
programs=agent,agent-worker
